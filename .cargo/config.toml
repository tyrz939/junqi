# Per-target code generation (PORT.md §3.2). One dedicated build per target.

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=x86-64"]

[target.i686-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=pentium4", "-C", "target-feature=+sse2"]

[target.i686-pc-windows-msvc]
rustflags = ["-C", "target-cpu=pentium4", "-C", "target-feature=+sse2"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=cortex-a53"]

[target.armv7-unknown-linux-gnueabihf]
rustflags = ["-C", "target-cpu=cortex-a7", "-C", "target-feature=+neon,+vfp4"]

[alias]
jane = "run -q -p jane-cli --"

# SDL2 from source (sdl2 `bundled`, PORT.md §7.1): its CMakeLists predates CMake 4, which refuses a
# minimum below 3.5 unless told to accept one.
[env]
CMAKE_POLICY_VERSION_MINIMUM = "3.5"
