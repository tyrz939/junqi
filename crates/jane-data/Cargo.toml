[package]
name = "jane-data"
description = "The compiled content: statics emitted by build.rs from /data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["std"]
# Off for the consoles (PORT.md §13.9): the compiled statics are `no_std` plus `alloc` then. The
# build script runs on the host with std either way.
std = ["jane-core/std", "jane-schema/std"]
# Load /data at startup through the same compile instead of the statics (ARCHITECTURE.md §6).
# Host only: it reads files and holds a Mutex, so it needs std.
dev-data = ["std", "jane-schema/compile"]

[dependencies]
# By path, not the workspace entries, so `default-features = false` holds (PORT.md §13.9).
jane-core = { path = "../jane-core", default-features = false }
jane-schema = { path = "../jane-schema", default-features = false }

[build-dependencies]
jane-schema = { workspace = true, features = ["compile"] }

[dev-dependencies]
jane-schema = { workspace = true, features = ["compile"] }
serde_json.workspace = true

[lints]
workspace = true
