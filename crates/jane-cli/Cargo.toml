[package]
name = "jane-cli"
description = "jane: gen, check, bench, replay, sheet, view, serve and the rest, headless"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "jane"
path = "src/main.rs"

[dependencies]
jane-core.workspace = true
jane-schema = { workspace = true, features = ["compile"] }
jane-data.workspace = true
jane-world.workspace = true
jane-sim.workspace = true
jane-net.workspace = true
jane-bot.workspace = true
jane-art.workspace = true
jane-present.workspace = true
jane-audio.workspace = true
jane-render-soft.workspace = true
# `jane bench tune` writes the ladder's rows into config.json's `present`.
serde_json.workspace = true
jane-render-gl2 = { workspace = true, optional = true }
jane-render-wgpu = { workspace = true, optional = true }

[features]
# PRESENTATION.md §6: the GPU backends for local use (`--backend gl2|wgpu`), off by default so CI and a
# Pi host build with no GPU stack (gl2 brings SDL2 for its hidden window's context).
gpu = ["dep:jane-render-gl2", "dep:jane-render-wgpu"]

[lints]
workspace = true
