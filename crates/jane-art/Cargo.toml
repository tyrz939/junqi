[package]
name = "jane-art"
description = "Procedural sprites, tiles, font, icons and chrome, with albedo, normal, emissive and height"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["std"]
# Off for the consoles (PORT.md §13.9, §13.11): the crate is `no_std` plus `alloc` then, and the
# terrain painter runs on the PSP. Nothing it draws differs between the two builds.
std = ["jane-core/std", "jane-data/std"]

[dependencies]
# By path, not the workspace entries, so `default-features = false` holds (PORT.md §13.9).
jane-core = { path = "../jane-core", default-features = false }
jane-data = { path = "../jane-data", default-features = false }

[lints]
workspace = true
