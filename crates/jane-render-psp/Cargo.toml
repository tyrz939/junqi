[package]
name = "jane-render-psp"
description = "C2 backend: the PSP's GE draws the Frame (PORT.md §13.12)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["std"]
# Off for the PSP: `no_std` plus `alloc`, as jane-present without its `std` (PORT.md §13.9).
std = ["jane-present/std", "jane-core/std"]

[dependencies]
# By path, so `default-features = false` holds (PORT.md §13.9).
jane-present = { path = "../jane-present", default-features = false }
# The sine table a spot light's cone is cut by, as `soft`'s lightmap.
jane-core = { path = "../jane-core", default-features = false }

# The GE glue (`ge.rs`) only: rust-psp's syscall stubs and its sceGu port, no allocator (the
# game owns one) and no `module!` (PORT.md §13.10). Never built on PC.
[target.'cfg(target_os = "psp")'.dependencies]
psp = { version = "0.3", features = ["stub-only"] }

[dev-dependencies]
jane-sim.workspace = true

# The workspace's lints, but `unsafe_code` denied rather than forbidden: the GE glue (`ge.rs`,
# PSP only) writes display lists and VRAM, and allows it there alone. Everything PC builds is
# safe code.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
many_single_char_names = "allow"
too_many_lines = "allow"
