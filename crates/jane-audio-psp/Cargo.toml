[package]
name = "jane-audio-psp"
description = "C2 sound: the cue table's asks to the tracker mixer, on an audio thread through sceAudio (PORT.md §13.4)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["std"]
# Off for the PSP: `no_std` plus `alloc`, as jane-present and jane-audio without theirs
# (PORT.md §13.9). With it on (the workspace's tests) the bus takes the PC's float placings and
# turns them to the same integers.
std = ["jane-audio/std", "jane-present/std", "jane-sim/std"]

[dependencies]
# By path, so `default-features = false` holds (PORT.md §13.9).
jane-audio = { path = "../jane-audio", default-features = false }
jane-present = { path = "../jane-present", default-features = false }
jane-sim = { path = "../jane-sim", default-features = false }
jane-core = { path = "../jane-core", default-features = false }

# The audio thread and sceAudio (`psp.rs`) only: rust-psp's syscall stubs, no allocator (the game
# owns one) and no `module!`. Never built on PC.
[target.'cfg(target_os = "psp")'.dependencies]
psp = { version = "0.3", features = ["stub-only"] }

# The workspace's lints, but `unsafe_code` denied rather than forbidden: the PSP glue (`psp.rs`,
# PSP only) starts a thread, hands it the mixer and writes sceAudio's buffers, and allows it there
# alone. Everything PC builds is safe code.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
many_single_char_names = "allow"
too_many_lines = "allow"
