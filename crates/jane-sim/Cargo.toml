[package]
name = "jane-sim"
description = "The deterministic simulation: state tree, tick, verbs, save, replay, hash, View"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["std"]
# Off for the consoles (PORT.md §13.9): the sim is `no_std` plus `alloc` then, and the shell
# supplies the allocator. PC and Pi keep it on; nothing the sim steps, saves or hashes differs.
std = ["jane-core/std", "jane-data/std", "jane-world/std", "lz4_flex/std", "postcard/use-std", "serde/std"]

[dependencies]
# By path, not the workspace entries, so `default-features = false` holds (PORT.md §13.9).
jane-core = { path = "../jane-core", default-features = false, features = ["serde"] }
jane-data = { path = "../jane-data", default-features = false }
jane-world = { path = "../jane-world", default-features = false }
# The save and the hash are one encoding (ARCHITECTURE.md §3.5, §3.6): serde derives it, postcard
# writes it, lz4_flex compresses the save, xxh3 hashes the same bytes streamed.
lz4_flex.workspace = true
once_cell.workspace = true
postcard.workspace = true
serde.workspace = true
xxhash-rust.workspace = true

[dev-dependencies]
# `tests/height_alloc.rs` counts the tick's allocations with it (ARCHITECTURE.md §9's counting
# allocator, held by that test binary alone; jane-cli already uses it for `bench --mem`).
cap = { version = "0.1.2", features = ["stats"] }

[lints]
workspace = true
