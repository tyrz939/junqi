[package]
name = "jane-sim"
description = "The deterministic simulation: state tree, tick, verbs, save, replay, hash, View"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
jane-core = { workspace = true, features = ["serde"] }
jane-data.workspace = true
jane-world.workspace = true
# The save and the hash are one encoding (ARCHITECTURE.md §3.5, §3.6): serde derives it, postcard
# writes it, lz4_flex compresses the save, xxh3 hashes the same bytes streamed.
lz4_flex = { workspace = true, features = ["std"] }
postcard = { workspace = true, features = ["use-std"] }
serde = { workspace = true, features = ["std"] }
xxhash-rust.workspace = true

[lints]
workspace = true
