[package]
name = "jane-core"
description = "Rng, hashes, the numeric types, grids, flood, chamfer, A*, ids and the Blueprint: what every other crate stands on"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["std"]
# Off for the consoles (PORT.md §13.9): the crate is `no_std` plus `alloc` then, and the shell
# supplies the allocator. PC and Pi keep it on; nothing the crate computes differs between the two.
std = ["indexmap/std", "serde?/std"]
# Serialize and Deserialize for the types the sim saves and hashes (ARCHITECTURE.md §3.5, §3.6).
# Off by default: world and schema never serialize a core type.
serde = ["dep:serde", "indexmap/serde"]

[dependencies]
hashbrown.workspace = true
indexmap.workspace = true
serde = { workspace = true, optional = true }

[lints]
workspace = true
