[package]
name = "jane-net"
description = "Lockstep over std::net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Test faults on the shipping types (`Guest::corrupt_at`): the crate's own tests turn it on.
test-hooks = []

[dependencies]
jane-core.workspace = true
jane-data.workspace = true
jane-sim.workspace = true
# The wire (PORT.md §3.5): postcard, the same canonical encoding as the save, derived by serde.
postcard = { workspace = true, features = ["use-std"] }
serde = { workspace = true, features = ["std"] }

[dev-dependencies]
jane-bot.workspace = true
jane-net = { path = ".", features = ["test-hooks"] }

[lints]
workspace = true
