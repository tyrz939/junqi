[package]
name = "jane-schema"
description = "The content schema: serde structs for every table, merge, interning, validation and codegen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["std"]
# Off for the consoles (PORT.md §13.9): the model and the emit are `no_std` plus `alloc` then.
std = ["jane-core/std"]
# The compile from /data. jane-data's build script and jane-cli turn it on; the game links only
# the model. Host only: it reads files, so it needs std.
compile = ["std", "dep:serde", "dep:serde_json", "dep:indexmap", "dep:xxhash-rust", "serde/std", "indexmap/std"]

[dependencies]
# By path, not the workspace entry, so `default-features = false` holds (PORT.md §13.9).
jane-core = { path = "../jane-core", default-features = false }
indexmap = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
xxhash-rust = { workspace = true, optional = true }

[lints]
workspace = true
