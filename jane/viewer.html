<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Jane: seed viewer</title>
    <style>
      :root { --bg: #14101a; --panel: #1e1826; --line: #3a3046; --ink: #e8e2d6; --dim: #9a90a6; --gold: #f0d048; --bad: #e0605a; --ok: #78c850; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.45 ui-monospace, Consolas, monospace; }
      header { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
      header h1 { font-size: 14px; margin: 0 8px 0 0; color: var(--gold); letter-spacing: 0.06em; }
      button, input { font: inherit; color: var(--ink); background: #2a2234; border: 1px solid var(--line); padding: 4px 9px; border-radius: 3px; }
      button { cursor: pointer; }
      button:hover { border-color: var(--gold); }
      button.on { background: var(--gold); color: #1a1420; border-color: var(--gold); }
      input { width: 120px; }
      .group { display: flex; gap: 4px; align-items: center; }
      .group span { color: var(--dim); margin-right: 2px; }
      #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; padding: 16px; }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 6px; cursor: pointer; }
      .card:hover { border-color: var(--gold); }
      .card.bad { border-color: var(--bad); }
      canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; border-radius: 2px; }
      .meta { display: flex; justify-content: space-between; gap: 8px; padding: 5px 2px 1px; color: var(--dim); font-size: 12px; }
      .meta b { color: var(--ink); font-weight: normal; }
      #detail { display: none; padding: 16px; gap: 16px; grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr); }
      #detail.open { display: grid; }
      #detail .side { max-height: calc(100vh - 90px); overflow: auto; }
      @media (max-width: 900px) { #detail.open { grid-template-columns: 1fr; } #detail .side { max-height: none; } }
      h2 { font-size: 12px; color: var(--gold); margin: 14px 0 4px; letter-spacing: 0.08em; text-transform: uppercase; }
      table { width: 100%; border-collapse: collapse; font-size: 12px; }
      td { padding: 2px 6px 2px 0; border-bottom: 1px solid #2a2234; vertical-align: top; }
      td.n { text-align: right; white-space: nowrap; color: var(--dim); }
      .ok { color: var(--ok); } .no { color: var(--bad); }
      .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--dim); font-size: 12px; margin-top: 6px; }
      .sw { display: inline-block; width: 10px; height: 10px; margin-right: 4px; vertical-align: -1px; border: 1px solid #0006; }
      p.note { color: var(--dim); margin: 6px 0 0; max-width: 70ch; }
    </style>
  </head>
  <body>
    <header>
      <h1>PROJECT JANE · SEEDS</h1>
      <div class="group"><span>from seed</span><input id="seed" inputmode="numeric" /><button id="go">Show</button><button id="next">Next 24</button><button id="rand">Random</button></div>
      <div class="group" id="layers"><span>paint</span><button data-layer="land">Land</button><button data-layer="threat">Threat</button><button data-layer="regions">Regions</button></div>
      <div class="group"><button id="night">Night</button><button id="labels">Labels</button><button id="back" style="display: none">Back to all</button></div>
      <div class="group"><span id="status"></span></div>
    </header>
    <main>
      <div id="grid"></div>
      <div id="detail">
        <div><canvas id="big"></canvas><div class="legend" id="legend"></div><p class="note" id="note"></p></div>
        <div class="side" id="side"></div>
      </div>
    </main>
    <script type="module" src="/src/viewer/main.ts"></script>
  </body>
</html>
