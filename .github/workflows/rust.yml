# The native build's CI (PORT.md §3.6). Jobs land as the phases that need them do:
# determinism diffs from P3, bench and play from P4, soak weekly.
name: rust

on:
  push:
    branches: [main, integration, density-integration]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  SEEDS: 64

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: tools/ci/float-gate.sh
      - name: the float-free crates build on 1.85 (rust9x)
        run: |
          rustup toolchain install 1.85 --profile minimal
          cargo +1.85 check -p jane-core -p jane-schema -p jane-data -p jane-world -p jane-sim -p jane-net -p jane-bot -p jane-art
      - name: jane check on /data
        run: cargo run -q -p jane-cli -- check

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --workspace
      - name: overflow checks on (the checked profile)
        run: SEEDS=16 cargo test --profile checked -p jane-core -p jane-world -p jane-sim

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --workspace
      - run: rustup target add i686-pc-windows-msvc
      - run: cargo build --release --workspace --target i686-pc-windows-msvc

  build-i686-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - run: rustup target add i686-unknown-linux-gnu
      - run: cargo build --release --workspace --target i686-unknown-linux-gnu
      - run: cargo test --target i686-unknown-linux-gnu -p jane-core

  build-arm:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [aarch64-unknown-linux-gnu, armv7-unknown-linux-gnueabihf]
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cross --git https://github.com/cross-rs/cross --locked
      - run: cross build --release --workspace --target ${{ matrix.target }}
      - name: core under qemu-user
        run: cross test --target ${{ matrix.target }} -p jane-core
